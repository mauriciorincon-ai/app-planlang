# CI del perfil --python del kit-app (v1.30.0; v1.30.1 pip-audit sin --strict) — se estampa SOLO con `--python`, junto a ci.yml.
# Job `python`: cuarto check requerido de la ruleset (quality · e2e · lighthouse|build-escritorio · python).
# Regla del método (v1.12.0): TODO gate nuevo nace con su DEMO en rojo — un cambio deliberado que lo
# hace fallar, registrado en la bitácora del sprint. Regla del kit (v1.26.0): sube su evidencia al fallar.
name: CI Python
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agents/pyproject.toml
            agents/constraints.txt
      - run: python -m pip install --upgrade pip
      # M-12 (ADR-003, adenda): se instala el venv validado, no lo último que admitan los rangos;
      # tests/test_constraints.py comprueba que el entorno instalado es el lock.
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --junitxml=../test-results/pytest.xml   # cobertura y umbral: [tool.pytest.ini_options] del pyproject
      # Sin --strict (kit v1.30.1): con --strict, pip-audit escala el salto del paquete editable (`pip install -e`)
      # a error ("distribution marked as editable") y el job cae en el commit inicial (planlang, 2026-09-26).
      # Las vulnerabilidades encontradas siguen devolviendo exit 1.
      - run: pip-audit --skip-editable
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pytest-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
