allowBuilds:
  sharp: true
  unrs-resolver: true
  '@swc/core': true
  esbuild: true
  '@tailwindcss/oxide': true
  '@sentry/cli': false
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@swc/core'
  - esbuild
  - '@tailwindcss/oxide'
ignoredBuiltDependencies:
  - '@sentry/cli'
# Avisos de seguridad aceptados a sabiendas: cada uno con su razón y su fecha de revisión en
# scripts/avisos-aceptados.json (tests/unit/guardias/avisos-aceptados.test.ts exige que coincidan y que no caduquen).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
# Overrides acotados al rango vulnerable y sin cruzar de mayor (regla 18; /deploy-check § 5): solo lo que un
# paquete clava por debajo del parche.
overrides:
  # serve 14.2.6 (la última) fija compression 1.8.1; GHSA-vc2v-76pw-4v95 se parchea en 1.8.2 (S3, 2026-10-05).
  "compression@<1.8.2": "^1.8.2"
