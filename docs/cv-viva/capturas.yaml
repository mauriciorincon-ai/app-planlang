# Las capturas de planlang para el brochure de CV Viva (devolución 026, punto 6). `pnpm capturas:cv-viva` las toma de `out/`:
# 1024×640 a DPR 1,5 (archivo de 1536×960), tema claro, español, WebP de hasta 80 KB; datos 100 % sintéticos.
# Cada entrada es un ESTADO de la vitrina: `ruta` y `perfil` (líder o experto), `ancla` (el encabezado, como expresión
# regular, al que se desplaza la página; vacío = arriba) y `accion` (u2-a-1600: U2 movido con el teclado, como el `u2a1600`
# del arnés de la app; recorrido-paso-3: el caso del recorrido, tres pasos adelante). `pie` es el texto de la ficha en CV Viva. Los pies y los estados vienen de RESPUESTA-026.md.
# «entrada» (la funcionalidad) usa un estado distinto al de la portada: «Cómo funciona», debajo del titular.
portada:
  archivo: "entrada.webp"
  ruta: "/es"
  perfil: "lider"
  ancla: null
  accion: null
capturas:
  - funcionalidad: "plantillas"
    archivo: "plantillas.webp"
    ruta: "/es/planes/hackguard-agentes"
    perfil: "experto"
    ancla: "^Riesgos$"
    accion: null
    pie:
      es: "Riesgos y supuestos del plan, cada uno marcado si salió de la plantilla"
      en: "The plan's risks and assumptions, each marked if it came from the template"
